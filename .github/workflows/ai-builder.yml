name: Autonomous AI Developer

on:
  issues:
    types: [opened, labeled]

jobs:
  build-feature:
    if: contains(github.event.issue.labels.*.name, 'ai-build') || github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider Agent
        run: pip install aider-chat

      - name: Run AI Agent on Codebase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config --global user.name "StudySmart AI Bot"
          git config --global user.email "ai-bot@users.noreply.github.com"
          
          # Navigate into project folder
          cd project
          
          # Run Aider with updated Gemini Flash alias
          aider --model gemini/gemini-2.5-flash --architect --yes --auto-commits --message "${{ github.event.issue.title }}: ${{ github.event.issue.body }}. NOTE: The codebase is in project/src/. Put views in project/src/views/ and components in project/src/components/."

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: auto-generated StudySmart core modules [skip ci]" || echo "No changes to commit"
          git push origin main
