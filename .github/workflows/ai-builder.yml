name: Autonomous AI Developer

on:
  issues:
    types: [opened, labeled]

jobs:
  build-feature:
    if: contains(github.event.issue.labels.*.name, 'ai-build') || github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider Agent
        run: pip install aider-chat

      - name: Run AI Agent on Codebase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config --global user.name "StudySmart AI Bot"
          git config --global user.email "ai-bot@users.noreply.github.com"
          
          cd project
          
          # Pass explicit target files to Aider so it creates them directly
          aider --model gemini/gemini-2.5-flash --yes --auto-commits \
            src/App.tsx \
            src/views/StudioDeck.tsx \
            src/views/Whiteboard.tsx \
            src/views/ExamArena.tsx \
            src/views/Privacy.tsx \
            --message "${{ github.event.issue.title }}: ${{ github.event.issue.body }}. Create the files src/views/StudioDeck.tsx, src/views/Whiteboard.tsx, src/views/ExamArena.tsx, and src/views/Privacy.tsx with full React Tailwind code. Then import and add routes for all 4 in src/App.tsx."

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add StudySmart views and updated App routing [skip ci]" || echo "No changes to commit"
          git push origin main
